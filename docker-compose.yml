version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: tsumi-postgres
    environment:
      POSTGRES_DB: tsumi_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tsumi-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend-py:
    build:
      context: ./apps/Tsumi-BE
      dockerfile: Dockerfile
    container_name: tsumi-backend-py
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./apps/Tsumi-BE:/app
    ports:
      - "8000:8000"
    environment: &backend-env
      - DEBUG=True
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=tsumi_db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - REDIS_URL=redis://redis:6379/1
      - CELERY_BROKER_URL=redis://redis:6379/0
      - JWT_SIGNING_KEY=dev-only-shared-jwt-key
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://localhost:3002
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  backend-node:
    build:
      context: ./apps/backend-node
      dockerfile: Dockerfile
    container_name: tsumi-backend-node
    command: npm run dev
    volumes:
      - ./apps/backend-node:/app
      - /app/node_modules
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - REDIS_URL=redis://redis:6379
      - PORT=3001
      - JWT_SECRET=dev-only-shared-jwt-key
    depends_on:
      redis:
        condition: service_healthy

  celery-worker:
    build:
      context: ./apps/Tsumi-BE
      dockerfile: Dockerfile
    container_name: tsumi-celery-worker
    command: celery -A backend worker -l info
    volumes:
      - ./apps/Tsumi-BE:/app
    environment: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Exactly one beat process: it schedules deposit reconciliation.
  celery-beat:
    build:
      context: ./apps/Tsumi-BE
      dockerfile: Dockerfile
    container_name: tsumi-celery-beat
    command: celery -A backend beat -l info
    volumes:
      - ./apps/Tsumi-BE:/app
    environment: *backend-env
    depends_on:
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:


