name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tsumi_test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies (Root)
        run: npm install

      - name: Install Python Dependencies
        working-directory: apps/Tsumi-BE
        run: pip install -r requirements.txt

      - name: Lint Frontend
        working-directory: apps/frontend
        run: |
          npm install
          npm run lint

      - name: Lint Backend (Python)
        working-directory: apps/Tsumi-BE
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Lint Backend (Node)
        working-directory: apps/backend-node
        run: |
          npm install
          npm run lint

      - name: Run Python Tests
        working-directory: apps/Tsumi-BE
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: tsumi_test_db
          DB_USER: postgres
          DB_PASSWORD: postgres
          REDIS_URL: redis://localhost:6379/1
        run: |
          python manage.py makemigrations --check --dry-run
          python manage.py test --settings=backend.test_settings

      - name: Typecheck Admin
        working-directory: apps/Tsumi-Admin-FE
        run: |
          npm install
          npm run typecheck

      - name: Typecheck and build Customer app
        working-directory: apps/Tsumi-Customer-FE
        run: |
          npm run typecheck
          npm run build

      - name: Typecheck and build Agent app
        working-directory: apps/Tsumi-Agent-FE
        run: |
          npm run typecheck
          npm run build

      - name: Build Frontend
        working-directory: apps/frontend
        run: npm run build

      - name: Build Backend (Node)
        working-directory: apps/backend-node
        run: npm run build

  flutter:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [packages/tsumi_kit, apps/mobile_customer, apps/mobile_agent]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Analyze and test
        working-directory: ${{ matrix.package }}
        run: |
          flutter pub get
          flutter analyze
          if [ -d test ] && ls test/*_test.dart >/dev/null 2>&1; then flutter test; fi

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Images
        run: |
          docker-compose build


